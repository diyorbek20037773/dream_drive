# Optional CUDA inference override (NOT part of the portable CPU default).
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d      (or: make up GPU=1)
# Host requirements: NVIDIA driver + NVIDIA Container Toolkit (Docker Desktop: WSL2 GPU support). Docker alone
# does not provide a GPU. GPU support is only claimed after the inference-gpu image has its own recorded smoke
# (see docs/QA.md); until then this profile is "unverified".
services:
  model-init:
    # The GPU image also contains app.model_init, so the CPU inference image is not needed in this profile.
    image: dreamdrive-inference-gpu:${DD_TAG:-dev}
    build:
      context: .
      dockerfile: inference/Dockerfile.gpu
      target: runtime
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_DIRTY: ${BUILD_DIRTY:-0}

  inference:
    image: dreamdrive-inference-gpu:${DD_TAG:-dev}
    build:
      context: .
      dockerfile: inference/Dockerfile.gpu
      target: runtime
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_DIRTY: ${BUILD_DIRTY:-0}
    environment:
      INFERENCE_DEVICE: cuda
      INFERENCE_PRECISION: ${INFERENCE_PRECISION_GPU:-fp16}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        limits:
          # CUDA context + pinned buffers need more host memory than the CPU path.
          memory: 4g
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
