# DreamDrive production stack: registry images pinned by digest only (no build sections), Caddy automatic HTTPS.
# Do not run this by hand; use deploy/deploy.sh, which validates the env + release files, backs up, pulls by
# digest, runs model-init, starts, waits for health, smoke-tests over HTTPS and records the deployed manifest:
#
#   deploy/deploy.sh --env-file /etc/dreamdrive/dreamdrive.env --release /path/to/release.env
#
# --env-file (chmod 600): DOMAIN, PUBLIC_ORIGIN, APP_SECRET, ADMIN_PASSWORD, limits...
# release.env (from the release workflow): GIT_COMMIT, *_IMAGE_DIGEST, GATEWAY_IMAGE, REDIS_IMAGE.
# Only the gateway publishes ports (80/443). Redis, inference, api, worker and web have no host ports.
name: dreamdrive

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-image: &backend-image ${DOCKERHUB_NAMESPACE:-diyorbek7377}/dreamdrive-backend@${BACKEND_IMAGE_DIGEST:?BACKEND_IMAGE_DIGEST (sha256:<64 hex>) is required}
x-inference-image: &inference-image ${DOCKERHUB_NAMESPACE:-diyorbek7377}/dreamdrive-inference@${INFERENCE_IMAGE_DIGEST:?INFERENCE_IMAGE_DIGEST (sha256:<64 hex>) is required}

x-backend-env: &backend-env
  APP_ENV: production
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required in production}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN (https://DOMAIN) is required}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE:-uz}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
  MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-120}
  MAX_VIDEO_WIDTH: ${MAX_VIDEO_WIDTH:-1920}
  MAX_VIDEO_HEIGHT: ${MAX_VIDEO_HEIGHT:-1080}
  MAX_QUEUED_PER_SESSION: ${MAX_QUEUED_PER_SESSION:-2}
  MAX_QUEUED_TOTAL: ${MAX_QUEUED_TOTAL:-10}
  MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-10}
  MAX_SIMULATION_WALL_SECONDS: ${MAX_SIMULATION_WALL_SECONDS:-120}
  ARTIFACT_RETENTION_HOURS: ${ARTIFACT_RETENTION_HOURS:-24}
  ANALYSIS_FPS: ${ANALYSIS_FPS:-5}
  INFERENCE_CONF_THRESHOLD: ${INFERENCE_CONF_THRESHOLD:-0.1}
  INFERENCE_BASE_URL: http://inference:8001
  INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-30}
  SIM_INFERENCE_TIMEOUT_SECONDS: ${SIM_INFERENCE_TIMEOUT_SECONDS:-5}
  SIMULATOR: ${SIMULATOR:-lite}
  SIM_PERCEPTION_SOURCE: ${SIM_PERCEPTION_SOURCE:-synthetic_rgb_cv}
  SIM_FIXED_DT_SECONDS: ${SIM_FIXED_DT_SECONDS:-0.05}
  LEARNED_SIM_MODE_ENABLED: ${LEARNED_SIM_MODE_ENABLED:-false}
  CARLA_HOST: ${CARLA_HOST:-}
  REDIS_URL: redis://redis:6379/0
  SQLITE_PATH: /data/dreamdrive.db
  DATA_ROOT: /data
  ARTIFACT_ROOT: /data/artifacts
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  WORKER_METRICS_PORT: "9101"
  ENABLE_MLFLOW: ${ENABLE_MLFLOW:-false}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
  # uvicorn honours X-Forwarded-For/-Proto only from these peers. The API has no host port and is reachable
  # only through the gateway on the internal network, which overwrites client-supplied forwarding headers.
  FORWARDED_ALLOW_IPS: "*"

x-inference-env: &inference-env
  MODEL_ROOT: /models
  MODEL_MANIFEST_PATH: /app/config/models.resolved.yaml
  INFERENCE_DEVICE: cpu
  INFERENCE_PRECISION: fp32
  INFERENCE_MAX_WAITERS: ${INFERENCE_MAX_WAITERS:-4}
  INFERENCE_MAX_IMAGE_BYTES: ${INFERENCE_MAX_IMAGE_BYTES:-8388608}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OMP_NUM_THREADS: ${INFERENCE_CPUS:-3}
  MKL_NUM_THREADS: ${INFERENCE_CPUS:-3}

services:
  volume-init:
    image: *backend-image
    pull_policy: missing
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /vol/data/artifacts /vol/data/tmp /vol/data/evaluations
        for d in /vol/*/; do
          find "$$d" -xdev \( ! -user 10001 -o ! -group 10001 \) -exec chown -h 10001:10001 {} +
        done
        echo "volume-init: named volumes owned by 10001:10001"
    volumes:
      - app-data:/vol/data
      - model-cache:/vol/models
      - caddy-data:/vol/caddy-data
      - caddy-config:/vol/caddy-config
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    logging: *default-logging

  model-init:
    image: *inference-image
    pull_policy: missing
    command: ["python", "-m", "app.model_init"]
    user: "10001:10001"
    environment: *inference-env
    volumes:
      - model-cache:/models
    depends_on:
      volume-init:
        condition: service_completed_successfully
    networks: [egress]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    restart: "no"
    logging: *default-logging

  inference:
    image: *inference-image
    pull_policy: missing
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "1"]
    user: "10001:10001"
    init: true
    environment: *inference-env
    volumes:
      - model-cache:/models:ro
    depends_on:
      model-init:
        condition: service_completed_successfully
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 180s
      start_interval: 5s
    deploy:
      resources:
        limits:
          cpus: "${INFERENCE_CPUS:-3}"
          memory: 3g
          pids: 512
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE (redis:7.4-alpine@sha256:...) is required}
    pull_policy: missing
    user: "999:1000"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "no"
    volumes:
      - redis-data:/data
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    restart: unless-stopped
    logging: *default-logging

  api:
    image: *backend-image
    pull_policy: missing
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    user: "10001:10001"
    init: true
    environment: *backend-env
    volumes:
      - app-data:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
          pids: 256
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *default-logging

  worker:
    image: *backend-image
    pull_policy: missing
    command: ["python", "-m", "app.jobs.worker_main"]
    user: "10001:10001"
    init: true
    environment: *backend-env
    volumes:
      - app-data:/data
    depends_on:
      volume-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
          pids: 512
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *default-logging

  web:
    image: ${DOCKERHUB_NAMESPACE:-diyorbek7377}/dreamdrive-web@${WEB_IMAGE_DIGEST:?WEB_IMAGE_DIGEST (sha256:<64 hex>) is required}
    pull_policy: missing
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    restart: unless-stopped
    logging: *default-logging

  gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE (caddy:2.10-alpine@sha256:...) is required}
    pull_policy: missing
    user: "10001:10001"
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.prod", "--adapter", "caddyfile"]
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${DD_PUBLIC_BIND:-0.0.0.0}:${DD_PUBLIC_HTTP_PORT:-80}:80"
      - "${DD_PUBLIC_BIND:-0.0.0.0}:${DD_PUBLIC_HTTPS_PORT:-443}:443"
      - "${DD_PUBLIC_BIND:-0.0.0.0}:${DD_PUBLIC_HTTPS_PORT:-443}:443/udp"
    depends_on:
      volume-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [internal, edge]
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    # Ports 80/443 inside the container; the caddy binary's file capability needs NET_BIND_SERVICE.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Dedicated loopback-style health listener (:8081, not published); :80 only redirects to HTTPS.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/gateway/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    restart: unless-stopped
    logging: *default-logging

networks:
  internal:
    internal: true
  edge: {}
  egress: {}

volumes:
  app-data: {}
  model-cache: {}
  redis-data: {}
  caddy-data: {}
  caddy-config: {}
