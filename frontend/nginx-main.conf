# Main nginx config for the DreamDrive web image (replaces the base image's /etc/nginx/nginx.conf).
# Same layout as nginxinc/nginx-unprivileged (pid and temp files under /tmp so the root filesystem can be read-only),
# with a fixed small worker count: "auto" starts one worker per host CPU even under a 0.5 CPU container limit.
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Query strings are not logged (they carry no secrets today, but keep logs minimal).
    log_format  main  '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}
