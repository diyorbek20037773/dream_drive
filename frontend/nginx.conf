# DreamDrive web container (nginxinc/nginx-unprivileged, runs as uid 101 on :8080).
# Static SPA only. The API is routed by the gateway (deploy/caddy), never by this container; no API host is compiled
# into the bundle. Works with a read-only root filesystem: nginx-unprivileged keeps pid/temp files under /tmp.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # Hashed build assets never change for a given file name.
    location /assets/ {
        include /etc/nginx/dreamdrive-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The API and health endpoints belong to the gateway. Answer clearly instead of serving the SPA shell.
    location ^~ /api/ {
        include /etc/nginx/dreamdrive-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"code":"service_unavailable","message":"The API is not served by the web container; use the gateway.","request_id":"","details":{}}';
    }
    location ^~ /health/ {
        include /etc/nginx/dreamdrive-security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"code":"service_unavailable","message":"The API is not served by the web container; use the gateway.","request_id":"","details":{}}';
    }

    location = /index.html {
        include /etc/nginx/dreamdrive-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: client-side routes (/video, /simulation/runs/<id>, ...) load index.html.
    location / {
        include /etc/nginx/dreamdrive-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
