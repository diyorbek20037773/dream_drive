[project]
name = "dreamdrive-inference"
version = "0.1.0"
description = "DreamDrive internal YOLOPv2 inference service"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "opencv-python-headless",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "prometheus-client",
  "python-multipart",
  "pyyaml",
  "rfdetr==1.11.2",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app/vendored/yolopv2_utils.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["app/vendored/"]

[[tool.mypy.overrides]]
module = ["app.vendored.*"]
ignore_errors = true
