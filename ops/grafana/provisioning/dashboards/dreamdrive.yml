# Dashboards are code: generated by scripts/gen_grafana_dashboards.py into ops/grafana/dashboards and mounted
# read-only. UI edits are not persisted (allowUiUpdates: false).
apiVersion: 1
providers:
  - name: dreamdrive
    orgId: 1
    folder: DreamDrive
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards/dreamdrive
      foldersFromFilesStructure: false
